# Continuous integration: the Go and Vitest suites on every push and pull
# request. Same commands as `make test` / `make test-frontend`; neither job
# needs an API key (mock LLM) or Docker (in-process mock provider).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch / PR cancels the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Go 1.24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Download modules
        run: go mod download

      - name: go test
        run: go test -count=1 ./...

  frontend:
    name: Frontend tests & build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm test
        run: npm test

      - name: npm run build
        run: npm run build
